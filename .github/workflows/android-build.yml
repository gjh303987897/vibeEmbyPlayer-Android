name: Android Build

# Builds the VibePlayer Android app's APKs on every push / PR and lets you
# download the resulting artifacts.
#
# SECURE RELEASE SIGNING (optional):
# The release APK is signed only when these encrypted repository secrets are
# configured (Settings > Secrets > Actions):
#   KEYSTORE_BASE64  - base64 of your .jks keystore (e.g. `base64 -w0 release.jks`)
#   KEYSTORE_PASSWORD- keystore password
#   KEY_ALIAS        - key alias inside the keystore
#   KEY_PASSWORD     - private-key password
# The keystore/passwords are NEVER committed to the repo. They are injected as
# environment variables at build time; GitHub masks them in logs. Without these
# secrets the release APK is produced unsigned (local dev / PRs still work).

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cached wrapper + dependencies)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode release signing keystore
        # NOTE: the `secrets` context is NOT usable in `if:` expressions, so we
        # mirror the secret into an env var and gate on that instead. When the
        # secret is absent this step is skipped and no keystore is produced,
        # so the release build below correctly falls back to unsigned.
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 secret not set; release APK will be unsigned."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          test -s "$RUNNER_TEMP/keystore.jks" || { echo "::error::Keystore decode produced an empty file."; exit 1; }

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        # KEYSTORE_FILE is exported only when the decoded keystore exists, so
        # build.gradle.kts only enables release signing when credentials were
        # actually provided. Otherwise (no secrets) it falls back to unsigned.
        run: |
          if [ -f "$RUNNER_TEMP/keystore.jks" ]; then
            export KEYSTORE_FILE="$RUNNER_TEMP/keystore.jks"
            echo "Release signing enabled (keystore found)."
          else
            export KEYSTORE_FILE=""
            echo "::warning::No keystore found; building unsigned release APK."
          fi
          ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify & label release APK signature
        # Verifies whether the release APK is signed and renames it so the
        # artifact name tells you at a glance: app-release-signed.apk vs
        # app-release-unsigned.apk. The KEYSTORE_BASE64 secret being absent is
        # the usual cause of an unsigned APK.
        run: |
          APK=$(ls app/build/outputs/apk/release/app-release*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No release APK produced."
            exit 1
          fi
          BT=$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BT/apksigner"
          if "$APKSIGNER" verify "$APK" >/dev/null 2>&1; then
            cp "$APK" app/build/outputs/apk/release/app-release-signed.apk
            echo "RELEASE APK IS SIGNED"
          else
            cp "$APK" app/build/outputs/apk/release/app-release-unsigned.apk
            echo "::warning::Release APK is UNSIGNED. Set the KEYSTORE_BASE64 + password/alias secrets and re-run. A signed APK is required for distribution/production install."
          fi

      - name: Run lint
        run: ./gradlew lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release-{signed,unsigned}.apk
          if-no-files-found: error
