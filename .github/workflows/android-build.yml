name: Android Build

# Builds the VibePlayer Android app's APKs on every push / PR and lets you
# download the resulting artifacts.
#
# The debug APK is intentionally signed by AGP with the standard Android Debug
# test certificate and is uploaded for internal/testing use only.
#
# SECURE RELEASE SIGNING (REQUIRED):
# The release APK is ALWAYS signed using these encrypted repository secrets
# (Settings > Secrets > Actions). They are REQUIRED — any release build fails
# loudly if they are missing instead of producing an unsigned APK.
#   KEYSTORE_BASE64  - base64 of your .jks keystore (e.g. `base64 -w0 release.jks`)
#   KEYSTORE_PASSWORD- keystore password
#   KEY_ALIAS        - key alias inside the keystore
#   KEY_PASSWORD     - private-key password
# The keystore/passwords are NEVER committed to the repo. They are injected as
# environment variables at build time; GitHub masks them in logs. Both CI and
# local ./gradlew release builds require these to be set.

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cached wrapper + dependencies)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode release signing keystore
        # Release signing is MANDATORY. The keystore is required, so this step
        # runs unconditionally and fails the build if the secret is missing or
        # the keystore cannot be decoded. An unsigned release APK is never
        # produced.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set. Add it (plus KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD) under Settings > Secrets > Actions, then re-run."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          if [ ! -s "$RUNNER_TEMP/keystore.jks" ]; then
            echo "::error::Failed to decode KEYSTORE_BASE64 into a valid keystore file."
            exit 1
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        # Release APKs must always be signed; build.gradle.kts fails loudly if
        # any signing credential is missing.
        run: ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify debug APK uses Android Debug test certificate
        # assembleDebug is signed automatically by the Android Gradle Plugin with
        # the standard ~/.android/debug.keystore. Verify both the signature and
        # the certificate identity before uploading the test artifact.
        run: |
          APK=$(ls app/build/outputs/apk/debug/app-debug.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No debug APK produced by the build."
            exit 1
          fi
          BT=$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BT/apksigner"
          if ! "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/debug-signature.txt" 2>&1; then
            cat "$RUNNER_TEMP/debug-signature.txt"
            echo "::error::Debug APK signature verification failed."
            exit 1
          fi
          cat "$RUNNER_TEMP/debug-signature.txt"
          if ! grep -Fq 'Signer #1 certificate DN: C=US, O=Android, CN=Android Debug' "$RUNNER_TEMP/debug-signature.txt"; then
            echo "::error::Debug APK is not signed with the Android Debug test certificate."
            exit 1
          fi
          echo "ANDROID DEBUG TEST-SIGNED APK VERIFIED: $APK"

      - name: Verify release APK signature
        # Confirms the produced release APK is actually signed; fails the build
        # otherwise so an unsigned release artifact is never uploaded.
        run: |
          APK=$(ls app/build/outputs/apk/release/app-release.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No release APK produced by the build."
            exit 1
          fi
          BT=$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)
          if ! "$ANDROID_SDK_ROOT/build-tools/$BT/apksigner" verify "$APK" >/dev/null 2>&1; then
            echo "::error::Release APK is NOT signed. Fix the signing configuration/secrets and re-run."
            exit 1
          fi
          echo "RELEASE APK IS SIGNED: $APK"

      - name: Run lint
        run: ./gradlew lintDebug

      - name: Upload debug APK (Android Debug test-signed)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk-android-test-signed
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
